<!-- 
 EDITAR HTML AGREGAR PROXIMO MANTENIMIENTO Y KILOMETRAJE
 Vehicle Cards Section 
 -->
 
<section class="space-y-6">
  <div *ngFor="let v of vehiculos" class="card p-6 flex flex-col md:flex-row items-center">
    <div class="flex-1 text-center md:text-left">
      <h2 class="text-xl font-bold text-gray-900 mb-1">{{ v.marca.nombre }} {{ v.modelo.nombre }}</h2>
      <p class="text-gray-700 mb-4">{{ v.dominio }}</p>
      <!-- Suggested Maintenance (Revised format) -->
      <div class="card p-6 flex flex-col items-start bg-blue-100 border-l-4 border-blue-500 mt-6">
        <p class="text-blue-800 text-lg font-semibold mb-2">Próximo Mantenimiento Sugerido, lo primero que ocurra:</p>
        <div class="flex items-center text-blue-800 text-xl font-bold">
          <i class="far fa-calendar-alt mr-2 text-blue-600"></i>
          <span class="mr-6">{{v.fecha_prox_servicio}}</span>
          <i class="fas fa-road mr-2 text-blue-600"></i>
          <span>{{v.kilometraje_prox_servicio}}</span>
        </div>
      </div>
      <div class="flex justify-center md:justify-start space-x-4 mt-6">
        <button class="button-secondary" (click)="administrarPermisos(v)">Administrar permisos</button>
        <button class="button-primary" (click)="verHistorial(v)">Ver historial</button>
      </div>
    </div>
  </div>
</section>
