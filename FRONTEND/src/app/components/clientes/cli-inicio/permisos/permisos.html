<main class="flex-1 p-8">

    <!-- Pending Requests Section -->
    <section class="card p-6 mb-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Solicitudes Pendientes</h2>
        <div class="space-y-4">
            <!-- Request Item 1 -->
            <div class="p-4 border-b border-gray-200 last:border-b-0">
                <div class="flex flex-col md:flex-row md:items-center justify-between">
                    <div>
                        <p class="font-semibold text-lg text-gray-800">Mecánica Rápida S.A.</p>
                        <p class="text-sm text-gray-600">Solicita acceso al historial de:</p>
                        <p class="font-medium text-blue-800 mt-1">Volkswagen Amarok (AB 123 CD)</p>
                    </div>
                    <div class="flex space-x-4 mt-4 md:mt-0">
                        <button class="button-primary text-sm">Aceptar</button>
                        <button class="button-secondary text-sm">Denegar</button>
                    </div>
                </div>
            </div>

            <!-- Request Item 2 -->
            <div class="p-4 border-b border-gray-200 last:border-b-0">
                <div class="flex flex-col md:flex-row md:items-center justify-between">
                    <div>
                        <p class="font-semibold text-lg text-gray-800">Taller del Norte</p>
                        <p class="text-sm text-gray-600">Solicita acceso al historial de:</p>
                        <p class="font-medium text-blue-800 mt-1">BMW 530i (AG 123 CD)</p>
                    </div>
                    <div class="flex space-x-4 mt-4 md:mt-0">
                        <button class="button-primary text-sm">Aceptar</button>
                        <button class="button-secondary text-sm">Denegar</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Granted Permissions Section -->
    <section class="card p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Permisos Otorgados</h2>
        <div class="space-y-4">
            <div *ngFor="let t of talleres" class="p-4 border-b border-gray-200 last:border-b-0">
                <div class="flex flex-col md:flex-row md:items-center justify-between">
                    <div>
                        <p class="font-semibold text-lg text-gray-800">{{ t.taller }}</p>
                        <p class="text-sm text-gray-600">Tiene acceso al historial de:</p>
                        <p class="font-medium text-blue-800 mt-1">{{ t.vehiculo }}</p>
                    </div>
                    <div class="flex space-x-4 mt-4 md:mt-0">
                        <button class="button-secondary text-sm" (click)="revocarPermiso(t)">Revocar</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>
