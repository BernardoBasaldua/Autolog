<main class="flex-1 p-8">
  <!-- Granted Permissions Section -->
  <section class="card p-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-4">Permisos Otorgados</h2>

    <div class="space-y-4" *ngIf="permisosOtorgados.length > 0; else noOtorgados">

      <div *ngFor="let p of permisosOtorgados" class="p-4 border-b border-gray-200 last:border-b-0">

        <div class="flex flex-col md:flex-row md:items-center justify-between">

          <div>
            <p class="font-semibold text-lg text-gray-800">
              {{ p.taller_autorizado?.nombre || p.cliente_autorizado?.usuario?.first_name + ' ' + p.cliente_autorizado?.usuario?.last_name }}
            </p>

            <p class="text-sm text-gray-600">Tiene acceso al historial desde:</p>

            <p class="font-medium text-blue-800 mt-1">
              {{ p.fecha_autorizacion }} 
            </p>
          </div>

          <div class="flex space-x-4 mt-4 md:mt-0">
            <button class="button-secondary text-sm" (click)="revocarPermiso(p)">Revocar</button>
          </div>

        </div>
      </div>

    </div>

    <ng-template #noOtorgados>
      <p class="text-gray-500">No hay permisos otorgados.</p>
    </ng-template>
  </section>

  <!-- Create New Permission Section -->
<section class="card p-6 mt-8">
  <h2 class="text-2xl font-bold text-gray-900 mb-4">Crear Nuevo Permiso</h2>

  <button
    class="button-primary mb-4"
    (click)="mostrarFormulario = !mostrarFormulario">
    + Nuevo permiso
  </button>

  <!-- Formulario para crear permiso -->
  <div *ngIf="mostrarFormulario" class="space-y-4 mt-4">

    <!-- Seleccionar destinatario -->
    <div>
      <label class="block font-medium mb-1">Otorgar acceso a</label>
      <select class="input w-full"
              [(ngModel)]="formNuevoPermiso.tipo_destinatario">
        <option value="cliente">Cliente</option>
        <option value="taller">Taller</option>
      </select>
    </div>

    <!-- Seleccionar cliente o taller -->
    <div *ngIf="formNuevoPermiso.tipo_destinatario === 'cliente'">
      <label class="block font-medium mb-1">Seleccionar Cliente</label>
      <select class="input w-full"
              [(ngModel)]="formNuevoPermiso.destinatario_id">
        <option *ngFor="let c of clientes" [value]="c.id">
          {{ c.usuario.first_name }} {{ c.usuario.last_name }}
        </option>
      </select>
    </div>

    <div *ngIf="formNuevoPermiso.tipo_destinatario === 'taller'">
      <label class="block font-medium mb-1">Seleccionar Taller</label>
      <select class="input w-full"
              [(ngModel)]="formNuevoPermiso.destinatario_id">
        <option *ngFor="let t of talleres" [value]="t.id">
          {{ t.nombre }}
        </option>
      </select>
    </div>

    <!-- Botones -->
    <div class="flex space-x-4 mt-4">
      <button class="button-primary" (click)="crearNuevoPermiso()">
        Crear permiso
      </button>

      <button class="button-secondary" (click)="mostrarFormulario = false">
        Cancelar
      </button>
    </div>

  </div>
</section>


</main>
