<!-- Flechita para volver -->
<section class="mb-6">
  <div class="card p-4 flex items-center space-x-4">
    <i
      class="fas fa-arrow-left text-gray-600 text-2xl cursor-pointer"
      [routerLink]="['/cliente/talleres']"
      title="Volver"
    ></i>
    <div *ngIf="taller">
      <h2 class="text-xl font-bold text-gray-900">{{ taller.nombre }}</h2>
    </div>
  </div>
</section>

<!-- Contenido de selección de turnos -->
<section class="card p-6">
  <p class="text-gray-600 mb-4">Selecciona un horario disponible para tu próximo servicio.</p>

  <!-- Appointment List -->
  <div class="space-y-4">
    <!-- Appointment Item 1 -->
    <div *ngFor="let turno of turnosDisponibles" class="flex items-center justify-between card p-4">
      <div>
        <p class="font-semibold text-lg text-gray-800">{{ turno.fecha | date:'dd MMMM yyyy' }}</p>
        <p class="text-sm text-gray-600">Horario: {{ turno.hora }}</p>
      </div>
      <button (click)="seleccionarTurno(taller, turno)" class="button-primary text-sm">Seleccionar</button>
    </div>
  </div>
</section>
