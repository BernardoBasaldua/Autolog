<!-- NOTIFICACIONES -->
@if (notice) {
<div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md">
    <div class="rounded-xl px-4 py-3 shadow-lg border" [ngClass]="{
        'bg-red-50 border-red-200 text-red-800': notice.type === 'error',
        'bg-blue-50 border-blue-200 text-blue-800': notice.type === 'info',
        'bg-green-50 border-green-200 text-green-800': notice.type === 'success'
      }">
        <div class="flex items-start gap-3">
            <div class="flex-1 text-sm font-medium">
                {{ notice.text }}
            </div>
            <button type="button" class="text-lg leading-none" (click)="clearNotice()">X</button>
        </div>
    </div>
</div>
}

<form class="space-y-4 mt-4" [formGroup]="tallerForm" (ngSubmit)="onSubmit()">

    <h3 class="text-lg font-semibold text-gray-800 mb-1">
        Datos del establecimiento
    </h3>

    <div class="grid grid-cols-1 gap-4">

        <!-- NOMBRE -->
        <div>
            <label for="taller-nombre" class="block text-gray-700 text-sm font-medium mb-1">
                Nombre del establecimiento
            </label>
            <input type="text" id="taller-nombre" formControlName="nombre" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>

        <!-- CUIT -->
        <div>
            <label for="taller-cuit" class="block text-gray-700 text-sm font-medium mb-1">
                CUIT
            </label>
            <input type="text" id="taller-cuit" formControlName="cuit" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>

        <!-- TELÉFONO -->
        <div>
            <label for="taller-telefono" class="block text-gray-700 text-sm font-medium mb-1">
                Teléfono de contacto
            </label>
            <input type="text" id="taller-telefono" formControlName="telefono" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>

        <!-- DIRECCIÓN -->
        <div>
            <label for="taller-direccion" class="block text-gray-700 text-sm font-medium mb-1">
                Dirección
            </label>
            <input type="text" id="taller-direccion" formControlName="direccion" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>

        <!-- DESCRIPCIÓN -->
        <div>
            <label for="taller-descripcion" class="block text-gray-700 text-sm font-medium mb-1">
                Descripción
            </label>
            <textarea id="taller-descripcion" formControlName="descripcion" rows="4"
                placeholder="Taller dedicado al mantenimiento general, servicios programados, reparaciones de motor, frenos, tren delantero, etc."
                class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                min-h-[120px]
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"></textarea>
        </div>

    </div>
    <!--AGREGO FORMULARIO CLIENTE-->
    @if(modo() == 'crear'){
    <app-form-clientes [modo]="'registroEstablecimiento'" (formInvalido)="formClienteInvalido = $event">
    </app-form-clientes>

    <button type="submit" class="button-primary w-full mt-2" [disabled]="tallerForm.invalid || formClienteInvalido">
        {{ modo() === 'crear' ? 'Registrarse como establecimiento' : 'Guardar cambios' }}
    </button>
    }@else {
    <button type="submit" class="button-primary w-full mt-2" [disabled]="tallerForm.invalid">
        {{ modo() === 'crear' ? 'Registrarse como establecimiento' : 'Guardar cambios' }}
    </button>
    }



</form>
