<form class="space-y-4 mt-4">
    <h3 class="text-lg font-semibold text-gray-800 mb-1">
    Datos del establecimiento
    </h3>

    <div class="grid grid-cols-1 gap-4">
    <div>
        <label for="taller-username" class="block text-gray-700 text-sm font-medium mb-1">
        Usuario responsable
        </label>
        <input
        type="text"
        id="taller-username"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
    </div>

    <div>
        <label for="taller-email" class="block text-gray-700 text-sm font-medium mb-1">
        Correo electrónico
        </label>
        <input
        type="email"
        id="taller-email"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
    </div>

    <div>
        <label for="taller-password" class="block text-gray-700 text-sm font-medium mb-1">
        Contraseña
        </label>
        <input
        type="password"
        id="taller-password"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
    </div>

    <div>
        <label for="taller-nombre" class="block text-gray-700 text-sm font-medium mb-1">
        Nombre del establecimiento
        </label>
        <input
        type="text"
        id="taller-nombre"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
    </div>

    <div>
        <label for="taller-telefono" class="block text-gray-700 text-sm font-medium mb-1">
        Teléfono de contacto
        </label>
        <input
        type="text"
        id="taller-telefono"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
    </div>
    </div>

    <button type="submit" class="button-primary w-full mt-2">
    Registrarse como establecimiento
    </button>
</form>
