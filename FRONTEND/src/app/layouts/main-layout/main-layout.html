<div class="min-h-screen">

    <!-- Overlay mobile -->
    <div *ngIf="sidebarOpen" class="fixed inset-0 bg-black/40 z-40 md:hidden" (click)="closeSidebar()"></div>

    <!-- Sidebar -->
    <app-aside class="
      fixed left-0 top-0 h-screen w-64 z-50
      transform transition-transform duration-200
      bg-slate-900 text-white
      md:translate-x-0
    " [ngClass]="{
      '-translate-x-full': !sidebarOpen,
      'translate-x-0': sidebarOpen
    }" (navigate)="closeSidebar()"></app-aside>

    <!-- Main -->
    <main class="min-h-screen md:ml-64 p-4 md:p-8">
        <!-- Header -->
        <app-header class="flex justify-between items-center mb-6 md:mb-8" (menuClick)="toggleSidebar()"></app-header>

        <router-outlet></router-outlet>
    </main>

</div>
