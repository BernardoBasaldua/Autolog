<div class="flex items-center justify-center min-h-screen p-4">
  <main class="w-full max-w-lg">
    <header class="flex flex-col items-center mb-8">
      <img src="icons/autolog-logo.png" alt="Logo Autolog"
           class="h-24 w-24 object-contain rounded-lg shadow-sm"
           onerror="this.onerror=null;this.src='Autolog.png';" />
      <h1 class="text-3xl font-bold text-gray-800 mt-4">Bienvenido</h1>
    </header>
    <!-----------router login registe------------------------->
    <section class="card p-8">
      <!-- Tabs -->
      <div class="flex justify-center mb-6 border-b border-gray-200 gap-4">
        <button
          type="button"
          class="tab-button active"
          (click)="showLogin()">
          Iniciar Sesión
        </button>

        <button
          type="button"
          class="tab-button"
          [ngClass]="{ 'active': vistaActual === 'register' }"
          (click)="showRegister()">
          Registrarse
        </button>
      </div>
      <!-----------FIN router login registe------------------------->
      
      <!-- LOGIN JWTSIMPLE DJANGO -->
      <!-- Vinculamos el FormGroup y disparamos token() al submit -->
      <form [formGroup]="loginForm" (ngSubmit)="token()" class="space-y-6">

        <div>
          <label for="login-username" class="block text-gray-700 font-semibold mb-2">
            Nombre de usuario
          </label>
          <input id="login-username"
                  type="text"
                  class="w-full"
                  formControlName="username"
                  autocomplete="username" />
          @if(loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')) {
            <small class="text-red-600">El usuario es requerido</small>
          }
        </div>

        <div>
          <label for="login-password" class="block text-gray-700 font-semibold mb-2">
            Contraseña
          </label>
          <input id="login-password"
                  type="password"
                  class="w-full"
                  formControlName="password"
                  autocomplete="current-password" />
          @if(loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')) {
            <small class="text-red-600">La contraseña es requerida</small>
          }
        </div>

        <button type="submit" class="button-primary w-full" [disabled]="loginForm.invalid">
          Iniciar Sesión
        </button>
        <!-- FIN LOGIN JWTSIMPLE DJANGO -->

        <!-- LOGIN GOOGLE -->
        <div class="flex items-center">
          <hr class="flex-grow border-gray-300" />
          <span class="mx-4 text-gray-500">o</span>
          <hr class="flex-grow border-gray-300" />
        </div>

        <button type="button" class="button-google w-full">
          <i class="fab fa-google"></i>
          Iniciar Sesión con Google
        </button>
      </form>
       
    </section>
  </main>
</div>
