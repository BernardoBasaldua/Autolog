<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedir Turno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }

        .sidebar {
            background-color: #1a202c;
            color: #e2e8f0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sidebar-item:hover {
            background-color: #2d3748;
        }

        .sidebar-item.active {
            background-color: #2a69ac;
            font-weight: 600;
        }

        .card {
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .button-primary {
            background-color: #2a69ac;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .button-primary:hover {
            background-color: #1c4a7e;
        }

        .button-secondary {
            background-color: #cbd5e0;
            color: #2d3748;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .button-secondary:hover {
            background-color: #a0aec0;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select {
            border: 1px solid #cbd5e0;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2a69ac;
        }
    </style>
</head>

<body class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="sidebar w-64 p-6 flex flex-col justify-between">
        <div>
            <!-- User Profile -->
            <div class="flex items-center mb-10">
                <div class="w-12 h-12 bg-gray-600 rounded-full flex items-center justify-center mr-3">
                    <i class="fas fa-user text-white text-xl"></i>
                </div>
                <div>
                    <p class="font-semibold text-lg">Jorge Pérez</p>
                    <p class="text-sm text-gray-400">jorge_p@gmail.com</p>
                </div>
            </div>

            <!-- Navigation Menu -->
            <nav>
                <ul>
                    <li class="mb-4">
                        <div class="sidebar-item">
                            <i class="fas fa-home mr-3"></i>
                            <span>Inicio</span>
                        </div>
                    </li>
                    <li class="mb-4">
                        <div class="sidebar-item active">
                            <i class="fas fa-calendar-alt mr-3"></i>
                            <span>Turnos</span>
                        </div>
                    </li>
                    <li class="mb-4">
                        <div class="sidebar-item">
                            <i class="fas fa-tools mr-3"></i>
                            <span>Talleres</span>
                        </div>
                    </li>
                    <li class="mb-4">
                        <div class="sidebar-item">
                            <i class="fas fa-clock mr-3"></i>
                            <span>Próximos mantenimientos</span>
                        </div>
                    </li>
                    <li class="mb-4">
                        <div class="sidebar-item">
                            <i class="fas fa-cog mr-3"></i>
                            <span>Configuración</span>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Pedir Turno</h1>
            <img src="https://placehold.co/100x100/ffffff/000000?text=Logo" alt="Logo Autolog"
                class="h-24 w-24 object-contain rounded-lg shadow-sm"
                onerror="this.onerror=null;this.src='Autolog (sin nombre) png.png';">
        </header>

        <!-- Form Section -->
        <section class="card p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Mecánica Premium S.A.</h2>
            <form id="appointment-form" class="space-y-4">
                <div>
                    <label for="username" class="block text-gray-700 font-semibold mb-2">Nombre del usuario</label>
                    <input type="text" id="username" name="username" placeholder="Tu nombre completo" class="w-full">
                </div>
                <div>
                    <label for="vehicle" class="block text-gray-700 font-semibold mb-2">Vehículo</label>
                    <select id="vehicle" name="vehicle" class="w-full">
                        <option value="">Selecciona un vehículo...</option>
                        <option value="ford-focus">Ford Focus (ABC 123)</option>
                        <option value="chevrolet-s10">Chevrolet S-10 (XYZ 789)</option>
                        <option value="honda-cb250">Honda CB250 Twister (MNO 456)</option>
                    </select>
                </div>
                <div>
                    <label for="date" class="block text-gray-700 font-semibold mb-2">Fecha</label>
                    <input type="date" id="date" name="date" class="w-full">
                </div>
                <div>
                    <label for="time" class="block text-gray-700 font-semibold mb-2">Hora</label>
                    <input type="time" id="time" name="time" class="w-full">
                </div>
                <div>
                    <label for="maintenance-options" class="block text-gray-700 font-semibold mb-2">Opciones de
                        mantenimientos</label>
                    <select id="maintenance-options" name="maintenance-options" class="w-full">
                        <option value="">Selecciona un servicio...</option>
                        <option value="cambio-aceite">Cambio de aceite</option>
                        <option value="revision-frenos">Revisión de frenos</option>
                        <option value="alineacion-balanceo">Alineación y balanceo</option>
                        <option value="cambio-filtros">Cambio de filtros</option>
                    </select>
                </div>
            </form>
            <div class="flex justify-end space-x-4 mt-8">
                <button class="button-secondary" onclick="alert('Volviendo a la página anterior...')">Volver</button>
                <button class="button-primary" onclick="alert('Turno confirmado.')">Confirmar</button>
            </div>
        </section>
    </main>
</body>

</html>
