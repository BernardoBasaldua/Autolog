<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión / Registrarse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        .card {
            background-color: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .button-primary {
            background-color: #2a69ac;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .button-primary:hover {
            background-color: #1c4a7e;
        }
        .button-google {
            background-color: #4285f4;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-google:hover {
            background-color: #357ae8;
        }
        .button-google .fa-google {
            margin-right: 0.5rem;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            border: 1px solid #cbd5e0;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            width: 100%;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #2a69ac;
        }
        .tab-button {
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: border-color 0.2s;
        }
        .tab-button.active {
            border-bottom-color: #2a69ac;
            color: #2a69ac;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <main class="w-full max-w-lg">
        <header class="flex flex-col items-center mb-8">
            <img src="https://placehold.co/100x100/ffffff/000000?text=Logo" alt="Logo Autolog" class="h-24 w-24 object-contain rounded-lg shadow-sm" onerror="this.onerror=null;this.src='Autolog (sin nombre) png.png';">
            <h1 class="text-3xl font-bold text-gray-800 mt-4">Bienvenido</h1>
        </header>

        <section class="card p-8">
            <!-- Tabs for Login and Register -->
            <div class="flex justify-center mb-6 border-b border-gray-200">
                <button id="login-tab" class="tab-button active">Iniciar Sesión</button>
                <button id="register-tab" class="tab-button">Registrarse</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="space-y-6">
                <div>
                    <label for="login-username" class="block text-gray-700 font-semibold mb-2">Nombre de usuario</label>
                    <input type="text" id="login-username" placeholder="Ingresa tu nombre de usuario" class="w-full">
                </div>
                <div>
                    <label for="login-password" class="block text-gray-700 font-semibold mb-2">Contraseña</label>
                    <input type="password" id="login-password" placeholder="Ingresa tu contraseña" class="w-full">
                </div>
                <button class="button-primary w-full">Iniciar Sesión</button>
                <div class="flex items-center">
                    <hr class="flex-grow border-gray-300">
                    <span class="mx-4 text-gray-500">o</span>
                    <hr class="flex-grow border-gray-300">
                </div>
                <button class="button-google w-full">
                    <i class="fab fa-google"></i>
                    Iniciar Sesión con Google
                </button>
            </div>

            <!-- Register Form (hidden by default) -->
            <div id="register-form" class="space-y-6 hidden">
                <button class="button-google w-full">
                    <i class="fab fa-google"></i>
                    Registrarse con Google
                </button>
                <div class="flex items-center">
                    <hr class="flex-grow border-gray-300">
                    <span class="mx-4 text-gray-500">o</span>
                    <hr class="flex-grow border-gray-300">
                </div>
                <div>
                    <label for="register-username" class="block text-gray-700 font-semibold mb-2">Nombre de usuario</label>
                    <input type="text" id="register-username" placeholder="Crea un nombre de usuario" class="w-full">
                </div>
                <div>
                    <label for="register-email" class="block text-gray-700 font-semibold mb-2">Correo electrónico</label>
                    <input type="email" id="register-email" placeholder="Ingresa tu correo electrónico" class="w-full">
                </div>
                <div>
                    <label for="register-password" class="block text-gray-700 font-semibold mb-2">Contraseña</label>
                    <input type="password" id="register-password" placeholder="Crea una contraseña" class="w-full">
                </div>
                <div>
                    <label for="confirm-password" class="block text-gray-700 font-semibold mb-2">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="Confirma tu contraseña" class="w-full">
                </div>
                <button class="button-primary w-full">Registrarse</button>
            </div>
        </section>
    </main>
    <script>
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        });
    </script>
</body>
</html>
